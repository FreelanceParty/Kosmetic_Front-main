<!DOCTYPE html>
<html lang="uk-UA">
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<meta name="robots" content="noindex, nofollow"/>
	<link rel="icon" href="/favicon.ico"/>
	<title>Технічні роботи | Beauty Blossom</title>
	<style>
		:root {
			--pink: #EC7080;
			--pink-soft: #FDECEF;
			--navy: #000E55;
			--muted: #5B6386;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px 16px;
			background: linear-gradient(180deg, #FFFFFF 0%, var(--pink-soft) 100%);
			color: var(--navy);
			font-family: Montserrat, "Segoe UI", Roboto, Arial, sans-serif;
		}

		main {
			width: 100%;
			max-width: 520px;
			text-align: center;
		}

		.logo {
			width: 180px;
			height: auto;
		}

		h1 {
			margin: 32px 0 12px;
			font-size: 26px;
			line-height: 1.3;
		}

		p {
			margin: 0 0 12px;
			font-size: 16px;
			line-height: 1.5;
			color: var(--muted);
		}

		.contacts {
			margin: 28px 0 0;
			padding: 20px;
			border-radius: 12px;
			background: #FFFFFF;
			box-shadow: 0 4px 24px rgba(0, 14, 85, 0.06);
		}

		.contacts p {
			margin-bottom: 8px;
			color: var(--navy);
		}

		a {
			color: var(--pink);
			font-weight: 600;
			text-decoration: none;
		}

		a:hover {
			text-decoration: underline;
		}

		.retry {
			display: inline-block;
			margin-top: 24px;
			padding: 12px 28px;
			border-radius: 27px;
			background: var(--navy);
			color: #FFFFFF;
		}
	</style>
</head>
<body>
<main>
	<img class="logo" src="/logo.png" alt="Beauty Blossom" width="180" height="58"/>
	<h1>Проводимо технічні роботи</h1>
	<p>Оновлюємо сайт, щоб він працював швидше. Зовсім скоро все знову запрацює.</p>
	<p>Ваш кошик збережено, повертайтесь трохи пізніше.</p>
	<div class="contacts">
		<p>Потрібна допомога вже зараз?</p>
		<p><a href="tel:+380500529100">+380 50 052 91 00</a></p>
		<p><a href="mailto:beautyblossom@gmail.com">beautyblossom@gmail.com</a></p>
		<p><a href="https://www.instagram.com/beauty_blossom_ua" target="_blank" rel="noopener">Instagram</a></p>
	</div>
	<a class="retry" href="/">Спробувати ще раз</a>
</main>
<script>
	setInterval(function () {
		fetch("/", {method: "HEAD", cache: "no-store"})
			.then(function (res) {
				if (res.status === 200) {
					window.location.replace("/");
				}
			})
			.catch(function () {
			});
	}, 60000);
</script>
</body>
</html>
